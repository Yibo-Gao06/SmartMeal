# =============================================================
#  SmartMeal 一键部署
#
#  使用前提：本机需已安装 Docker Desktop。
#  （当前开发机未安装 Docker，因此本文件暂未验证运行，
#    本机开发请直接看 README 的「本地启动」一节，不依赖 Docker。）
#
#  启动：
#    cd smartmeal-deploy
#    docker compose up -d
#
#  首次启动前先构建应用镜像：
#    cd ..
#    ./mvnw clean package -DskipTests
# =============================================================

services:

  mysql:
    image: mysql:8.0
    container_name: smartmeal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartmeal123}
      MYSQL_DATABASE: smartmeal
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 关闭 binlog 可以减少开发环境的磁盘占用；生产必须开启以支持主从与恢复
      - --skip-log-bin
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行，建表 + 灌种子数据
      - ./sql/mysql-init.sql:/docker-entrypoint-initdb.d/01-mysql-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-smartmeal123}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [smartmeal]

  redis:
    image: redis:7-alpine
    container_name: smartmeal-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [smartmeal]

  # RAG 向量库。当前应用未启用（smartmeal.ai.rag-enabled 走内存检索），
  # 接入 Embedding 模型后再打开，并新增 PgVectorRetrievalService。
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartmeal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartmeal123}
      POSTGRES_DB: smartmeal_vector
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql/pgvector-init.sql:/docker-entrypoint-initdb.d/01-pgvector-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [smartmeal]
    profiles: ["vector"]

  app-api:
    build:
      context: ..
      dockerfile: smartmeal-deploy/Dockerfile.app
    container_name: smartmeal-app-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartmeal123}
      REDIS_HOST: redis
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 .env 中配置 DEEPSEEK_API_KEY}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [smartmeal]

  admin-api:
    build:
      context: ..
      dockerfile: smartmeal-deploy/Dockerfile.admin
    container_name: smartmeal-admin-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartmeal123}
      REDIS_HOST: redis
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 .env 中配置 DEEPSEEK_API_KEY}
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [smartmeal]

  nginx:
    image: nginx:1.27-alpine
    container_name: smartmeal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-api
      - admin-api
    networks: [smartmeal]

volumes:
  mysql-data:
  redis-data:
  pg-data:

networks:
  smartmeal:
    driver: bridge
