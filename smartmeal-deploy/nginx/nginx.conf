# =============================================================
#  SmartMeal Nginx 反向代理
#
#  核心难点：SSE 流式接口必须关闭代理缓冲，否则 Nginx 会把
#  后端推送的事件攒在缓冲区里，等攒够一块才转发 —— 前端看到的
#  就不是「打字机效果」，而是「卡十几秒后一次性蹦出全部内容」。
# =============================================================

upstream smartmeal_app {
    server app-api:8080;
    keepalive 32;
}

upstream smartmeal_admin {
    server admin-api:8081;
}

server {
    listen 80;
    server_name localhost;

    charset utf-8;
    client_max_body_size 10m;

    # 访问日志里加上上游响应时间，排查 SSE 卡顿很有用
    access_log /var/log/nginx/smartmeal.access.log;
    error_log  /var/log/nginx/smartmeal.error.log warn;

    # ---------- AI 流式接口（必须放在最前面，规则最长匹配优先）----------
    location ~ ^/api/app/ai/.*/stream$ {
        proxy_pass http://smartmeal_app;
        proxy_http_version 1.1;

        # 关闭缓冲三件套 —— 少任何一个 SSE 都会失效
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # 保持长连接
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 告诉 Nginx 这是流式响应，不要按普通响应处理
        chunked_transfer_encoding on;

        # 超时设置：read_timeout 必须大于单次生成的最长耗时。
        # 应用侧 SseEmitter 是 180s，这里给 300s 留余量。
        # 应用每 15s 发一次 heartbeat，正常情况下不会触发这个超时。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 心跳保活，防止中间的负载均衡器掐断空闲连接
        proxy_set_header X-Accel-Buffering no;
    }

    # ---------- 用户端接口 ----------
    location /api/app/ {
        proxy_pass http://smartmeal_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ---------- 用户端接口文档 ----------
    location ~ ^/(doc\.html|webjars/|v3/api-docs|swagger-ui) {
        proxy_pass http://smartmeal_app;
        proxy_set_header Host $host;
    }

    # ---------- 管理端（生产应加 IP 白名单）----------
    location /api/admin/ {
        # 生产环境务必放开下面两行，只允许内网或办公网访问
        # allow 10.0.0.0/8;
        # deny all;

        proxy_pass http://smartmeal_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /admin-doc/ {
        proxy_pass http://smartmeal_admin/doc.html;
        proxy_set_header Host $host;
    }

    # ---------- 健康检查 ----------
    location /health {
        proxy_pass http://smartmeal_app/actuator/health;
        access_log off;
    }

    # ---------- 静态资源（前端构建产物）----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 单页应用：刷新子路由时不 404
        try_files $uri $uri/ /index.html;

        # 带 hash 的静态资源可以长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 隐藏 Nginx 版本号
    server_tokens off;
}
